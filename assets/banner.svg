<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#2a1260"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset="0.5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1000" height="280" fill="url(#sky)"/>
  <rect width="1000" height="280" fill="url(#horizon)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="95" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="70" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="90" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="45" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="130" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="800" cy="125" r="120" fill="url(#halo)">
    <animate attributeName="r" values="110;130;110" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="125" r="72" fill="url(#moon)"/>
  <circle cx="780" cy="108" r="9" fill="#ffffff" opacity="0.18"/>
  <circle cx="822" cy="140" r="14" fill="#ffffff" opacity="0.12"/>

  <!-- far hills -->
  <path d="M0 230 L90 190 L170 225 L270 175 L380 228 L470 200 L560 235 L680 195 L780 232 L900 200 L1000 225 L1000 280 L0 280 Z" fill="#1a0b3d" opacity="0.9"/>

  <!-- torii gate silhouette -->
  <g fill="#0d1117">
    <path d="M700 84 Q800 108 900 84 L908 100 Q800 126 692 100 Z"/>
    <rect x="712" y="104" width="176" height="9"/>
    <rect x="742" y="122" width="116" height="9"/>
    <rect x="752" y="100" width="14" height="150"/>
    <rect x="834" y="100" width="14" height="150"/>
  </g>

  <!-- near ground -->
  <path d="M0 248 Q250 232 500 250 T1000 244 L1000 280 L0 280 Z" fill="#0d1117"/>

  <!-- falling sakura petals -->
  <g fill="#ff8fd8">
    <g><animateTransform attributeName="transform" type="translate" values="120,-20;20,300" dur="9s" begin="0s" repeatCount="indefinite"/><ellipse rx="6" ry="3.5" opacity="0.9"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="260,-20;150,300" dur="11s" begin="-3s" repeatCount="indefinite"/><ellipse rx="5" ry="3" opacity="0.85"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="5s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="400,-20;310,300" dur="8s" begin="-5s" repeatCount="indefinite"/><ellipse rx="6" ry="3.5" opacity="0.9"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.6s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="540,-20;420,300" dur="10s" begin="-1s" repeatCount="indefinite"/><ellipse rx="5" ry="3" opacity="0.8"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="4.6s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="660,-20;560,300" dur="12s" begin="-7s" repeatCount="indefinite"/><ellipse rx="6" ry="3.5" opacity="0.9"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.2s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="760,-20;650,300" dur="9.5s" begin="-4s" repeatCount="indefinite"/><ellipse rx="5" ry="3" opacity="0.85"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.8s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="880,-20;770,300" dur="11s" begin="-6s" repeatCount="indefinite"/><ellipse rx="6" ry="3.5" opacity="0.9"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.4s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="960,-20;850,300" dur="8.5s" begin="-2s" repeatCount="indefinite"/><ellipse rx="5" ry="3" opacity="0.8"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="60,-20;-40,300" dur="10.5s" begin="-8s" repeatCount="indefinite"/><ellipse rx="5" ry="3" opacity="0.85"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/></ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="340,-20;240,300" dur="13s" begin="-9s" repeatCount="indefinite"/><ellipse rx="6" ry="3.5" opacity="0.9"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="3.4s" repeatCount="indefinite"/></ellipse></g>
  </g>

  <!-- text -->
  <text x="60" y="88" font-family="'Yu Gothic','Hiragino Sans','Noto Sans JP',sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#00f0ff">ようこそ</text>
  <text x="56" y="172" font-family="Orbitron,'Segoe UI',Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="5" fill="#ffffff" filter="url(#glow)">VISHRUTH</text>
  <rect x="60" y="188" width="150" height="3" fill="#ff2bd6"/>
  <text x="60" y="222" font-family="Orbitron,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#ff8fd8">hey! thanks for stopping by</text>
</svg>
